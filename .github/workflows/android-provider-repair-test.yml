name: Android provider repair APK test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-repair-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      ZHENGUOJIAN_PACKAGE_NAME: ${{ vars.ZHENGUOJIAN_PACKAGE_NAME }}
      ZHENGUOJIAN_DISPLAY_NAME: ${{ vars.ZHENGUOJIAN_DISPLAY_NAME }}
      ZHENGUOJIAN_LATIN_NAME: ${{ vars.ZHENGUOJIAN_LATIN_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Require and validate permanent signing identity
        env:
          Z_KEY: ${{ secrets.ZHENGUOJIAN_KEYSTORE_BASE64 }}
          Z_STORE_PASS: ${{ secrets.ZHENGUOJIAN_KEYSTORE_PASSWORD }}
          Z_ALIAS: ${{ secrets.ZHENGUOJIAN_KEY_ALIAS }}
          Z_KEY_PASS: ${{ secrets.ZHENGUOJIAN_KEY_PASSWORD }}
          A_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          A_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          A_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ZHENGUOJIAN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$Z_KEY" && -n "$Z_STORE_PASS" && -n "$Z_ALIAS" && -n "$Z_KEY_PASS" ]]; then
            key="$Z_KEY"; storepass="$Z_STORE_PASS"; alias="$Z_ALIAS"; keypass="$Z_KEY_PASS"
            echo "Using configured ZHENGUOJIAN signing secret set"
          elif [[ -n "$A_KEY" && -n "$A_STORE_PASS" && -n "$A_ALIAS" && -n "$A_KEY_PASS" ]]; then
            key="$A_KEY"; storepass="$A_STORE_PASS"; alias="$A_ALIAS"; keypass="$A_KEY_PASS"
            echo "Using configured ANDROID signing secret set; certificate must match ZHENGUOJIAN_CERT_SHA256"
          else
            echo "::error::No complete permanent signing secret set. Configure ZHENGUOJIAN_KEYSTORE_BASE64, ZHENGUOJIAN_KEYSTORE_PASSWORD, ZHENGUOJIAN_KEY_ALIAS, ZHENGUOJIAN_KEY_PASSWORD (or the corresponding ANDROID_* set), using your original private signing key."
            exit 1
          fi
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure ZHENGUOJIAN_CERT_SHA256 with the SHA-256 certificate fingerprint of your currently installed APK"
            exit 1
          fi
          jks="$RUNNER_TEMP/release.jks"
          printf '%s' "$key" | tr -d '[:space:]' | base64 -d > "$jks"
          test -s "$jks" || { echo "::error::Signing keystore is empty"; exit 1; }
          keytool -list -v -keystore "$jks" -storepass "$storepass" -alias "$alias" > "$RUNNER_TEMP/key-info.txt" || {
            echo "::error::Cannot open signing key or alias; check original keystore and passwords"; exit 1;
          }
          actual=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/key-info.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signing certificate is not the original ZHENGUOJIAN certificate; refusing incompatible APK"
            exit 1
          fi
          echo "::add-mask::$storepass"
          echo "::add-mask::$keypass"
          {
            echo "ANDROID_KEYSTORE_PATH=$jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$storepass"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEY_PASSWORD=$keypass"
          } >> "$GITHUB_ENV"
      - name: Build ARM64 and ARMv7 test APKs with custom providers
        run: |
          set -euo pipefail
          python scripts/build_android.py --all-sources --abi arm64-v8a --abi armeabi-v7a --sources native/sources_custom
      - name: Verify release certificate (never accept debug signing)
        env:
          CERT_SHA256: ${{ vars.ZHENGUOJIAN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test -n "$expected" || { echo "::error::Missing expected signing fingerprint"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n1)
          test -n "$apksigner"
          shopt -s nullglob
          apks=(dist/android/*.apk)
          test "${#apks[@]}" -ge 2 || { echo "::error::Expected both APK ABIs"; exit 1; }
          for apk in "${apks[@]}"; do
            "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert-info.txt"
            grep -iF "$expected" <(tr -d ':' < "$RUNNER_TEMP/cert-info.txt" | tr '[:upper:]' '[:lower:]') || {
              echo "::error::Unexpected signing certificate on $apk"; exit 1;
            }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guo2-provider-repair-signed-test-apks
          path: dist/android/*.apk
          retention-days: 7
          if-no-files-found: error

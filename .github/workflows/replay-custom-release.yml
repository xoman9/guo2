name: Replay custom changes onto upstream Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-custom-release.yml
      - scripts/sync_release_custom.py

permissions:
  contents: write

concurrency:
  group: guo2-release-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout automation branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate rebuild script syntax
        run: python -m py_compile scripts/sync_release_custom.py
      - name: Rebuild from latest stable upstream Release and apply reviewed customizations
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPORT: ${{ runner.temp }}/guo2-release-sync.md
        run: python scripts/sync_release_custom.py
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sync-report-${{ github.run_number }}
          path: ${{ runner.temp }}/guo2-release-sync.md
          if-no-files-found: warn
      - name: Stop when customization requires user decisions
        if: always() && steps.sync.outputs.failures != '' && steps.sync.outputs.failures != '0'
        env:
          FAILED: ${{ steps.sync.outputs.failures }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          echo "::error::${FAILED} customizations need decisions. Read RELEASE_SYNC_REPORT.md on ${BRANCH}; do not auto-merge or publish."
          exit 1
      - name: Set up Go
        if: steps.sync.outputs.failures == '0'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test upstream Release plus customizations (Go)
        if: steps.sync.outputs.failures == '0'
        working-directory: native
        run: go test ./...
      - name: Set up Flutter
        if: steps.sync.outputs.failures == '0'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Test upstream Release plus customizations (Flutter)
        if: steps.sync.outputs.failures == '0'
        run: |
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Verify upstream all-sources build links custom module
        if: steps.sync.outputs.failures == '0'
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q 'duanjuapp/native/sources_custom' native/bridge/sources_gen.go
          if grep -q 'sources_example' native/bridge/sources_gen.go; then
            echo "::error::Refusing upstream synthetic example sources."
            exit 1
          fi
          (cd native && go test -tags=zhenguojian ./...)
      - name: Verify only prior guo2 added sources
        if: steps.sync.outputs.failures == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          registry = subprocess.check_output(
              ['git', 'show', 'origin/custom:native/core/provider_apk391_registry.go'],
              text=True,
          )
          match = re.search(r'var apk391Sources\s*=\s*\[\]apk391SourceSpec\s*\{(.*?)\n\}', registry, re.S)
          if match is None:
              raise SystemExit('Previous guo2 channel registry missing')
          expected = set(re.findall(r'\{\s*"([a-z][a-z0-9-]*)"\s*,', match.group(1)))
          expected |= {'lujj31', 'liuguo', 'xiaoguo'}
          target = Path('native/sources_custom/flavor_zhenguojian.go').read_text(encoding='utf-8')
          actual = set(re.findall(r'"([a-z][a-z0-9-]*)"', target))
          actual.discard('zhenguojian')
          if actual != expected:
              raise SystemExit(f'Added source mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          print(f'Prior guo2 added source IDs retained: {len(expected)}')
          PY
      - name: Final instructions
        if: success()
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          echo "Generated branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed. Review changes before merging into custom. No APK or GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

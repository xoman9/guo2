name: Replay custom changes onto upstream Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-custom-release.yml
      - scripts/sync_release_custom.py

permissions:
  contents: write

concurrency:
  group: guo2-release-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout automation branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild from latest stable upstream Release and apply custom patches
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPORT: ${{ runner.temp }}/guo2-release-sync.md
        run: python scripts/sync_release_custom.py
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sync-report-${{ github.run_number }}
          path: ${{ runner.temp }}/guo2-release-sync.md
          if-no-files-found: warn
      - name: Diagnose Go compatibility on generated branch
        if: steps.sync.outputs.conflicts != '0'
        shell: bash
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$SYNC_BRANCH"
          git checkout --detach FETCH_HEAD
          echo "Go compatibility diagnostics for $SYNC_BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Go for compatibility diagnosis
        if: steps.sync.outputs.conflicts != '0'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Capture unresolved Go compiler errors
        if: steps.sync.outputs.conflicts != '0'
        working-directory: native
        shell: bash
        run: |
          set +e
          go test ./... > "$RUNNER_TEMP/guo2-go-compatibility.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/guo2-go-compatibility.log"
          echo "Go diagnostic exit code: $result" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload Go compatibility report
        if: steps.sync.outputs.conflicts != '0'
        uses: actions/upload-artifact@v4
        with:
          name: go-compatibility-${{ github.run_number }}
          path: ${{ runner.temp }}/guo2-go-compatibility.log
          if-no-files-found: warn
      - name: Check unresolved custom patch conflicts
        if: steps.sync.outputs.conflicts != '0'
        env:
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          echo "::error::Custom patch replay has $CONFLICTS conflicting paths; review RELEASE_SYNC_REPORT.md on generated branch."
          exit 1
      - name: Set up Go
        if: steps.sync.outputs.conflicts == '0'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test upstream Release plus custom patches (Go)
        if: steps.sync.outputs.conflicts == '0'
        working-directory: native
        run: go test ./...
      - name: Set up Flutter
        if: steps.sync.outputs.conflicts == '0'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Test upstream Release plus custom patches (Flutter)
        if: steps.sync.outputs.conflicts == '0'
        run: |
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Verify upstream all-sources build links custom module
        if: steps.sync.outputs.conflicts == '0'
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q 'duanjuapp/native/sources_custom' native/bridge/sources_gen.go
          if grep -q 'sources_example' native/bridge/sources_gen.go; then
            echo "::error::Refusing upstream synthetic example sources."
            exit 1
          fi
          (cd native && go test -tags=zhenguojian ./...)
      - name: Verify original custom channel coverage
        if: steps.sync.outputs.conflicts == '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          expected = set("""
          hongguo hanxiaoquan guipian sorani huangdou huangju yeguo
          lujj31 liuguo xiaoguo youguo meiguo yingguo luguo liguo
          juguo ningguo mangguo chengguodj jiaoguo dsd jinguoduanju
          jinguo heitao beabox huangguo-video huangguoai cloudfront
          """.split())
          path = Path("native/sources_custom/flavor_zhenguojian.go")
          selected = set(re.findall(r'"([a-z][a-z0-9-]*)"', path.read_text(encoding="utf-8")))
          missing = sorted(expected - selected)
          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write(f"\nCustom source parity: {len(expected)-len(missing)}/{len(expected)}\n")
              if missing:
                  stream.write("Missing: " + ", ".join(missing) + "\n")
          print(f"Expected {len(expected)} historical sources; selected {len(expected)-len(missing)}.")
          if missing:
              raise SystemExit("Missing custom source modules: " + ", ".join(missing))
          PY
      - name: Final instructions
        if: success()
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          echo "Generated branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed. Review changes before merging into custom. No APK or GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

name: Validate guo2 release rebuild (draft PR)
on:
  pull_request:
    paths:
      - scripts/sync_release_custom.py
      - .github/workflows/replay-custom-release.yml
      - .github/workflows/check-release-rebuild.yml
      - GUO2_RELEASE_REBUILD_CHECKLIST.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-rebuild-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and required rebuild invariants
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_release_custom.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('scripts/sync_release_custom.py').read_text(encoding='utf-8')
          code = ast.parse(source)
          assert 'repos/Xanerix/guoapp/releases/latest' in source, 'latest stable Release discovery removed'
          assert '"--3way"' not in source and 'git("apply"' not in source, '3-way replay reintroduced'
          for key in ('01 UI', '02 Downloads', '03 Merge', '04 Providers', '05 Settings', '06 Coexist'):
              assert key in source, f'missing customization phase: {key}'
          for key in ('RELEASE_SYNC_REPORT.md', 'if failures:', 'restore_rule_path(path)'):
              assert key in source, f'missing failure handling: {key}'
          assert 'TestReleaseReplayCustomChannelsRegistered' in source, 'added-source provider test missing'
          assert '"com.duanju.coexist"' in source, 'coexist package name missing'
          assert '"failures=0' in source, 'success output contract missing'
          print('Release rebuild structural guards passed')
          PY

  dry-run-latest-replay:
    name: Replay latest Release without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply reviewed customizations to latest Release (read-only dry run)
        id: replay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_DRY_RUN: '1'
          SYNC_REPORT: ${{ runner.temp }}/release-replay.md
        run: |
          set -euo pipefail
          python scripts/sync_release_custom.py
      - name: Setup Go
        if: steps.replay.outcome == 'success'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test Go core after replay
        if: steps.replay.outcome == 'success'
        working-directory: native
        run: go test ./...
      - name: Link full custom source module (never example providers)
        if: steps.replay.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q 'duanjuapp/native/sources_custom' native/bridge/sources_gen.go
          if grep -q 'sources_example' native/bridge/sources_gen.go; then
            echo "::error::Example-only providers would produce an incomplete guo2 build."
            exit 1
          fi
      - name: Test guo2 previously added Provider adapters
        if: steps.replay.outcome == 'success'
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          go test -tags=zhenguojian ./... 2>&1 | tee "$RUNNER_TEMP/guo2-extra-providers.log"
      - name: Setup Flutter
        if: always() && steps.replay.outcome == 'success'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Flutter analyzer and widget tests
        if: always() && steps.replay.outcome == 'success'
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Set up Android build toolchain
        if: steps.replay.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        if: steps.replay.outcome == 'success'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - name: Install required Android NDK
        if: steps.replay.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version='28.2.13676358'
          path="$ANDROID_HOME/ndk/$version"
          if [ ! -f "$path/source.properties" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$version"
          fi
          grep -Eq "Pkg.Revision[[:space:]]*=[[:space:]]*$version" "$path/source.properties"
      - name: Build ARM64 and v7a test-only coexist APKs (not permanent signed)
        if: steps.replay.outcome == 'success'
        env:
          ZHENGUOJIAN_PACKAGE_NAME: com.duanju.coexist
          ZHENGUOJIAN_DISPLAY_NAME: 小果影視-共存版
          ZHENGUOJIAN_LATIN_NAME: XiaoGuo
          PROJECT_URL: https://github.com/xoman9/guo2
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          python scripts/build_android.py --all-sources --abi arm64-v8a --abi armeabi-v7a
      - name: Validate both test APK identities and native libraries
        if: steps.replay.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/android/*arm64-v8a.apk dist/android/*armeabi-v7a.apk)
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "::error::Expected exactly ARM64 and v7a test APKs; got ${#apks[@]}"
            exit 1
          fi
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -n "$aapt" && test -n "$signer"
          for apk in "${apks[@]}"; do
            "$signer" verify --verbose "$apk"
            manifest=$("$aapt" dump badging "$apk")
            printf '%s\n' "$manifest" | grep -q "package: name='com.duanju.coexist'"
            echo "Verified coexist package and signature: $(basename "$apk")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "These are CI test-signed builds, NOT permanently signed update APKs." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ARM64/v7a test builds (never publish Release)
        if: steps.replay.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guo2-latest-replay-TEST-ONLY-unsigned-for-update
          path: |
            dist/android/*arm64-v8a.apk
            dist/android/*armeabi-v7a.apk
          retention-days: 7
          if-no-files-found: error
      - name: Show compatibility decisions
        if: always()
        env:
          REPORT: ${{ runner.temp }}/release-replay.md
        run: |
          if [ -s "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT"
          else
            echo "No replay report was generated; see the replay job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guo2-latest-release-replay-report
          path: ${{ runner.temp }}/release-replay.md
          if-no-files-found: warn
      - name: Require a successful replay
        if: steps.replay.outcome != 'success'
        run: |
          echo "::error::Latest Release replay requires review; see the generated numbered report."
          exit 1

name: Validate guo2 release rebuild (draft PR)
on:
  pull_request:
    paths:
      - scripts/sync_release_custom.py
      - .github/workflows/replay-custom-release.yml
      - .github/workflows/check-release-rebuild.yml
      - GUO2_RELEASE_REBUILD_CHECKLIST.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-rebuild-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and required rebuild invariants
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_release_custom.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('scripts/sync_release_custom.py').read_text(encoding='utf-8')
          code = ast.parse(source)
          assert 'repos/Xanerix/guoapp/releases/latest' in source, 'latest stable Release discovery removed'
          assert '"--3way"' not in source and 'git("apply"' not in source, '3-way replay reintroduced'
          for key in ('01 UI', '02 Downloads', '03 Merge', '04 Providers', '05 Settings', '06 Coexist'):
              assert key in source, f'missing customization phase: {key}'
          for key in ('RELEASE_SYNC_REPORT.md', 'if failures:', 'restore_rule_path(path)'):
              assert key in source, f'missing failure handling: {key}'
          assert 'TestHistorical28SourcesAvailable' in source, 'functional source test missing'
          assert '"com.duanju.coexist"' in source, 'coexist package name missing'
          assert '"failures=0' in source, 'success output contract missing'
          print('Release rebuild structural guards passed')
          PY

  dry-run-latest-replay:
    name: Replay latest Release without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply reviewed customizations to latest Release (read-only dry run)
        id: replay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_DRY_RUN: '1'
          SYNC_REPORT: ${{ runner.temp }}/release-replay.md
        run: |
          set -euo pipefail
          python scripts/sync_release_custom.py
      - name: Setup Go
        if: steps.replay.outcome == 'success'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test Go core after replay
        if: steps.replay.outcome == 'success'
        working-directory: native
        run: go test ./...
      - name: Link full custom source module (never example providers)
        if: steps.replay.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q 'duanjuapp/native/sources_custom' native/bridge/sources_gen.go
          if grep -q 'sources_example' native/bridge/sources_gen.go; then
            echo "::error::Example-only providers would produce an incomplete guo2 build."
            exit 1
          fi
      - name: Test all-sources Go registration and adapters
        if: steps.replay.outcome == 'success'
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          go test -tags=zhenguojian ./... 2>&1 | tee "$RUNNER_TEMP/source-parity.log"
      - name: Setup Flutter
        if: always() && steps.replay.outcome == 'success'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Flutter analyzer and widget tests
        if: always() && steps.replay.outcome == 'success'
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Add missing Provider diagnostics to replay report
        if: always()
        env:
          REPORT: ${{ runner.temp }}/release-replay.md
          SOURCE_LOG: ${{ runner.temp }}/source-parity.log
        shell: bash
        run: |
          if [ -s "$SOURCE_LOG" ]; then
            {
              echo
              echo "## Actual build/test compatibility results"
              if grep -q 'unregistered:' "$SOURCE_LOG"; then
                echo
                echo "**Unregistered historical channels (requires porting actual Provider implementations):**"
                grep -E 'unregistered: ' "$SOURCE_LOG" | sed -E 's/.*unregistered: ([a-z0-9-]+).*/- \`\1\`/' | sort -u
                echo
                echo "Decision: port these legacy implementations to the current upstream Host/Provider Registry; do not add names without working adapters or silently delete channels."
              fi
              if grep -qE '(^| )FAIL|undefined:|no required module' "$SOURCE_LOG"; then
                echo
                echo "See the GitHub Actions Go step for the full error messages."
              fi
            } >> "$REPORT"
          fi
      - name: Show compatibility decisions
        if: always()
        env:
          REPORT: ${{ runner.temp }}/release-replay.md
        run: |
          if [ -s "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT"
          else
            echo "No replay report was generated; see the replay job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guo2-latest-release-replay-report
          path: ${{ runner.temp }}/release-replay.md
          if-no-files-found: warn
      - name: Require a successful replay
        if: steps.replay.outcome != 'success'
        run: |
          echo "::error::Latest Release replay requires review; see the generated numbered report."
          exit 1

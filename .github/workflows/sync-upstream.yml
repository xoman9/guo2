name: Sync upstream into guo2
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guo2-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Checkout repository with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Upstream commits may modify .github/workflows/*.yml.
          # GITHUB_TOKEN lacks the workflow-update capability required for
          # pushing those commits. A user-created PAT with Contents + Workflows
          # write access preserves upstream history without stripping files.
          token: ${{ secrets.GUO2_UPSTREAM_SYNC_TOKEN || github.token }}
          persist-credentials: true
      - name: Fetch and integrate upstream safely
        id: merge
        shell: bash
        env:
          GUO2_UPSTREAM_SYNC_TOKEN: ${{ secrets.GUO2_UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Xanerix/guoapp.git
          git fetch source main
          git fetch origin upstream custom
          old_upstream=$(git rev-parse origin/upstream)
          new_upstream=$(git rev-parse source/main)
          before_custom=$(git rev-parse origin/custom)
          # GitHub rejects pushes that introduce workflow-file changes
          # unless the authenticated credential can update workflows.
          # Fail early with a one-time setup instruction instead of trying
          # to force/squash or silently dropping upstream workflow changes.
          if [ -z "${GUO2_UPSTREAM_SYNC_TOKEN:-}" ] && \
             git diff --name-only "$old_upstream" "$new_upstream" -- .github/workflows | grep -q .; then
            echo '::error::Upstream changed .github/workflows/*.yml. Add repository secret GUO2_UPSTREAM_SYNC_TOKEN with Contents: Read and write plus Workflows: Read and write permissions; then rerun the workflow.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$old_upstream" "$new_upstream"; then
            echo 'Upstream history changed non-fast-forward. Manual review required.' >&2
            exit 1
          fi
          if [ "$old_upstream" != "$new_upstream" ]; then
            git push origin "$new_upstream:refs/heads/upstream"
            echo "Updated upstream: $old_upstream -> $new_upstream" >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout -B custom origin/custom
          if ! git merge --no-edit source/main; then
            git merge --abort || true
            echo 'Merge conflict: custom untouched. Resolve manually.' >&2
            exit 1
          fi
          after_custom=$(git rev-parse HEAD)
          if [ "$before_custom" = "$after_custom" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Custom already up to date; no build requested.' >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin HEAD:refs/heads/custom
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Updated custom: $before_custom -> $after_custom" >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-custom.yml
    secrets: inherit
